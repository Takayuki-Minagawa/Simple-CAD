version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; a TS 7 bump breaks `npm ci`.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # jsdom 30 requires Node ^22.22.2 || ^24.15, narrower than our engines field.
      - dependency-name: jsdom
        update-types: ['version-update:semver-major']
      # Keep Node typings on the runtime major used in CI (Node 24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      development-tooling:
        dependency-type: development
      production-dependencies:
        dependency-type: production
